<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access denied</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h2>403 - Access denied</h2>
    <div class="alert error">Your account does not own the role required by this page.</div>
    <p class="muted">
        A <code>ROLE_USER</code> account cannot open <code>/admin/**</code>.
        Sign in with <code>admin / 1234</code> to reach the admin area.
    </p>
    <div class="links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/user/dashboard}">User area</a>
    </div>
</div>
</body>
</html>
