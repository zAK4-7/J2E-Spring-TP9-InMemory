<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <span class="brand">User area</span>
    <span class="who" th:text="'Signed in as ' + ${username}"></span>
</div>

<div class="card wide">
    <h2>User dashboard</h2>
    <div class="alert success">Access granted: this page requires <code>ROLE_USER</code>.</div>

    <table>
        <tr><th>Username</th><td th:text="${username}"></td></tr>
        <tr><th>Granted authorities</th>
            <td><span th:each="a : ${authorities}" th:text="${a}" style="margin-right:10px"></span></td></tr>
    </table>

    <div class="links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/admin/dashboard}">Try the admin area</a>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="danger">Sign out</button>
    </form>
</div>
</body>
</html>
